<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BM25 Search Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-[#18181b] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="w-full px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-[#18181b]/60 backdrop-blur-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-green-600 flex items-center justify-center text-white font-bold shadow-md">
                    <i class="fa-solid fa-bolt text-sm"></i>
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-semibold tracking-tight">BM25 Search Engine</h1>
                    <p class="text-xs text-slate-400">Lexical Keyword Search & Root Tokenization</p>
                </div>
            </div>
            <button onclick="toggleTheme()" class="p-2.5 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300">
                <i id="theme-icon" class="fa-solid fa-sun text-sm"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full max-w-4xl mx-auto px-4 py-8 flex flex-col space-y-6">
        <div class="relative flex items-center bg-white dark:bg-[#27272a] rounded-2xl border border-slate-300 dark:border-slate-700 shadow-md p-2 focus-within:ring-2 focus-within:ring-emerald-500 transition-all">
            <div class="pl-3 pr-2 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></div>
            <input type="text" id="search-input" placeholder="Search medical terms, e.g., 'femoral artery blood'..." class="w-full bg-transparent focus:outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400 text-sm md:text-base py-1 pr-3" onkeydown="if(event.key === 'Enter') performSearch()">
            <button onclick="performSearch()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-xl transition-all flex items-center space-x-2 shadow-sm shrink-0">
                <span>Search</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>

        <div id="search-feed" class="space-y-6">
            <div class="p-6 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800/40 text-emerald-900 dark:text-emerald-200 space-y-2">
                <div class="flex items-center space-x-2 font-semibold text-sm">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Ready to Search</span>
                </div>
                <p class="text-xs md:text-sm text-emerald-800/80 dark:text-emerald-300/80 leading-relaxed">
                    Type a query above to test the BM25 lexical retriever.
                </p>
            </div>
        </div>
    </main>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon text-sm";
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun text-sm";
            }
        }

        async function performSearch() {
            const input = document.getElementById('search-input');
            const query = input.value.trim();
            if (!query) return;

            const feed = document.getElementById('search-feed');

            const queryBlock = document.createElement('div');
            queryBlock.className = "flex justify-end my-4";
            queryBlock.innerHTML = `
                <div class="max-w-xl px-5 py-3 rounded-2xl bg-rose-100 dark:bg-rose-950/40 text-rose-900 dark:text-rose-100 border border-rose-200 dark:border-rose-900/50 shadow-sm flex items-start space-x-3">
                    <div>
                        <div class="text-xs font-semibold text-rose-600 dark:text-rose-400 uppercase tracking-wider mb-0.5">User Search</div>
                        <div class="text-sm md:text-base font-medium">${escapeHtml(query)}</div>
                    </div>
                </div>
            `;
            feed.appendChild(queryBlock);

            const loadingId = 'loading-' + Date.now();
            const loadingBlock = document.createElement('div');
            loadingBlock.id = loadingId;
            loadingBlock.className = "p-4 rounded-2xl bg-slate-100 dark:bg-slate-800/50 text-slate-500 text-xs flex items-center space-x-3 animate-pulse";
            loadingBlock.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-emerald-500 text-base"></i><span>Calculating BM25 relevance scores...</span>`;
            feed.appendChild(loadingBlock);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch('http://localhost:8000/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query }) // Fixed from message: message
                });

                if (!response.ok) throw new Error(`Server returned status ${response.status}`);

                const data = await response.json();
                document.getElementById(loadingId).remove();

                const resultGroup = document.createElement('div');
                resultGroup.className = "space-y-4 my-6";

                let tokensHtml = (data.query_tokens || []).map(t => `<span class="px-2 py-0.5 rounded bg-emerald-200 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-200 text-xs font-mono">${t}</span>`).join(' ');
                
                let resultCardContent = `
                    <div class="p-4 rounded-2xl bg-slate-100 dark:bg-[#202124] border border-slate-200 dark:border-slate-800 space-y-3">
                        <div class="flex flex-wrap items-center justify-between text-xs text-slate-500 dark:text-slate-400 gap-2 border-b border-slate-200 dark:border-slate-800/80 pb-2">
                            <div class="flex items-center space-x-2">
                                <span class="font-semibold text-emerald-600 dark:text-emerald-400">BM25 Stats:</span>
                                <span>${data.total_matches} matches</span>
                                <span>•</span>
                                <span>${data.latency_ms} ms</span>
                            </div>
                            <div class="flex items-center space-x-1">
                                <span class="mr-1">Query Roots:</span>
                                ${tokensHtml || '<em class="text-slate-400">None</em>'}
                            </div>
                        </div>
                `;

                if (!data.results || data.results.length === 0) {
                    resultCardContent += `<div class="p-4 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-amber-800 dark:text-amber-200 text-xs">No document matched.</div>`;
                } else {
                    data.results.forEach(res => {
                        let matchedBadge = (res.matched_tokens || []).map(m => `<span class="text-xs bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 px-1.5 py-0.5 rounded">${m}</span>`).join(' ');
                        resultCardContent += `
                            <div class="p-4 rounded-xl bg-emerald-50/80 dark:bg-emerald-950/30 border border-emerald-200/80 dark:border-emerald-800/40 text-emerald-950 dark:text-emerald-100 space-y-2 shadow-sm">
                                <div class="flex items-center justify-between text-xs">
                                    <span class="font-semibold px-2 py-0.5 rounded bg-emerald-600 text-white">Rank #${res.rank}</span>
                                    <span class="font-mono text-emerald-700 dark:text-emerald-300 font-bold">Score: ${res.score}</span>
                                </div>
                                <p class="text-sm leading-relaxed">${escapeHtml(res.content)}</p>
                                ${matchedBadge ? `<div class="text-xs flex items-center space-x-1 pt-1"><span class="text-slate-400 text-[11px]">Matched Roots:</span> ${matchedBadge}</div>` : ''}
                            </div>
                        `;
                    });
                }
                resultCardContent += `</div>`;
                resultGroup.innerHTML = resultCardContent;
                feed.appendChild(resultGroup);

            } catch (err) {
                console.er
                document.getElementById(loadingId).innerHTML = `
                    <div class="text-rose-500 text-xs font-semibold">
                        ❌ Error connecting to server on http://localhost:8000. Ensure uvicorn server:app --reload is running.
                    </div>
                `;
            }
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
